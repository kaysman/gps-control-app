<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bariox Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', sans-serif; background: #F6F4EE; color: #1C3D5E; height: 100vh; overflow: hidden; }
      #root { height: 100vh; display: flex; flex-direction: column; }
      button { font-family: 'Inter', sans-serif; }
      input { font-family: 'Inter', sans-serif; }
      @keyframes bxRise { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
      @keyframes bxSpin  { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
