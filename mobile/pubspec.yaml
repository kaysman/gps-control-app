name: gps_control
description: GPS tracker control app — BLE and SMS command interface
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

workspace:
  - packages/bariox_tracker
  - packages/sms_tracker_commands

dependencies:
  another_telephony: ^0.4.1
  bariox_tracker:
    path: packages/bariox_tracker
  bloc: ^9.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_blue_plus: ^2.2.1
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  intl: any
  permission_handler: ^11.3.1
  sms_tracker_commands:
    path: packages/sms_tracker_commands

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
